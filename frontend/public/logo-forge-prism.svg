<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Hemlock Logo: 锻造棱镜 (Forge Prism) -->
  <!-- 三角棱镜 -->
  <path d="M50 10 L 86 72 L 14 72 Z"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  <!-- 入射光束 -->
  <line x1="5" y1="45" x2="38" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 折射光束 (扇形展开) -->
  <line x1="62" y1="58" x2="92" y2="38" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="62" y1="58" x2="93" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="62" y1="58" x2="92" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="62" y1="58" x2="90" y2="74" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <!-- 棱镜内部核心 -->
  <circle cx="50" cy="55" r="5" fill="currentColor" opacity="0.9"/>
  <!-- 底部锻造线 -->
  <line x1="30" y1="82" x2="70" y2="82" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="36" y1="88" x2="64" y2="88" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
</svg>
