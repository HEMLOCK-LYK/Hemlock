<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Hemlock Logo: 雷达之眼 (Scan Eye) -->
  <!-- 眼睛轮廓 -->
  <path d="M8 50 C 28 22, 72 22, 92 50 C 72 78, 28 78, 8 50 Z"
        fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
  <!-- 雷达弧线 (上半部分) -->
  <path d="M 32 50 A 18 18 0 0 1 68 50"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
  <path d="M 38 50 A 12 12 0 0 1 62 50"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.6"/>
  <path d="M 44 50 A 6 6 0 0 1 56 50"
        fill="none" stroke="currentColor" stroke-width="2" opacity="0.8"/>
  <!-- 中心瞄准点 -->
  <circle cx="50" cy="50" r="4" fill="currentColor"/>
  <!-- 十字准星 -->
  <line x1="50" y1="30" x2="50" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="50" y2="70" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="40" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="50" x2="70" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- 扫描线 -->
  <line x1="8" y1="50" x2="92" y2="50" stroke="currentColor" stroke-width="1" opacity="0.2" stroke-dasharray="2 3"/>
</svg>
